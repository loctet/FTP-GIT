<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FTPGit Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cff'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7v13M10 14l6 6 6-6M9 24h14' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round' transform='rotate(180 16 16)'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    try { const t = localStorage.getItem('ftpgit.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" id="brandLogo"></div>
        <div>
          <div class="brand-name">FTPGit Studio</div>
          <div class="brand-sub">FTP client &amp; Git deploys</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-section">
        <span>Connections</span>
        <button class="icon-btn sm" id="addConnBtn" title="New connection"></button>
      </div>
      <div class="conn-list" id="connList"></div>
      <div class="side-footer" id="sideFooter"></div>
    </aside>
    <main class="main">
      <div class="update-banner" id="updateBanner" hidden></div>
      <header class="topbar" id="topbar"></header>
      <section class="content" id="content"></section>
      <div class="term-dock" id="termDock"></div>
    </main>
  </div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>
  <div class="transfers" id="transfers"></div>
  <input type="file" id="filePicker" multiple hidden />
  <input type="file" id="folderPicker" webkitdirectory multiple hidden />
  <script src="/js/app.js"></script>
</body>
</html>
